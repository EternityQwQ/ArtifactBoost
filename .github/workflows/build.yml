name: Build ArtifactBoost

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    # 注意：XcodeGen 生成的是新版 Xcode 工程格式（objectVersion 77），
    # 旧版 Xcode（15.x）无法打开，所以这里固定用自带 Xcode 16 的 macos-15 镜像，
    # 且不要再手动 xcode-select 切换到旧版本 Xcode。
    runs-on: macos-15
    env:
      SCHEME: ArtifactBoost
      APP_NAME: ArtifactBoost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project "${APP_NAME}.xcodeproj"

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release-iphoneos/${APP_NAME}.app"
          test -d "${APP}"
          rm -rf Payload "${APP_NAME}-unsigned.ipa"
          mkdir -p Payload
          cp -R "${APP}" Payload/
          zip -qry "${APP_NAME}-unsigned.ipa" Payload

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedDataSim \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: Package Simulator app
        run: |
          set -euo pipefail
          cd "DerivedDataSim/Build/Products/Release-iphonesimulator"
          zip -qry "${GITHUB_WORKSPACE}/${APP_NAME}-simulator.zip" "${APP_NAME}.app"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArtifactBoost-build
          path: |
            ArtifactBoost-unsigned.ipa
            ArtifactBoost-simulator.zip
          if-no-files-found: error
          retention-days: 30